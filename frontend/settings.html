<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Settings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">

        <!-- SIDEBAR -->
        <aside class="sidebar p-3 d-flex flex-column">
            <button class="btn btn-primary w-100 mb-4" onclick="window.location.href='index.html'">
                <i class="bi bi-arrow-left me-2"></i> Back to Lists
            </button>
            <ul class="nav flex-column gap-1">
                <li class="nav-item">
                    <a href="#change-username" class="nav-link active d-flex align-items-center">
                        <i class="bi bi-person me-2 fs-5"></i> Username
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#change-password" class="nav-link d-flex align-items-center">
                        <i class="bi bi-lock me-2 fs-5"></i> Password
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#delete-account" class="nav-link d-flex align-items-center text-danger">
                        <i class="bi bi-trash me-2 fs-5"></i> Delete Account
                    </a>
                </li>
            </ul>
        </aside>

        <!-- CONTENT -->
        <div class="app-content">

            <!-- HEADER -->
            <header class="app-header d-flex align-items-center justify-content-between px-4 py-3 border-bottom">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light d-md-none" id="sidebar-toggle">
                        <i class="bi bi-list fs-5"></i>
                    </button>
                    <div class="brand-wrap">
                        <div class="brand-logo">
                            <i class="bi bi-check2-circle"></i>
                        </div>
                        <div>
                            <h3 class="app-title mb-0">Settings</h3>
                            <p class="text-muted small mb-0">Manage your account</p>
                        </div>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <div class="dropdown">
                        <button class="btn avatar-btn dropdown-toggle" id="profile-dropdown" data-bs-toggle="dropdown">
                            <span id="avatar-initial">U</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><span class="dropdown-item-text" id="avatar-username">User</span></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="logout-btn"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <!-- MAIN -->
            <main class="p-4 pt-5 pb-5 d-flex flex-column gap-4" style="max-width: 600px;">

                <!-- CHANGE USERNAME -->
                <div class="settings-section" id="change-username">
                    <h5 class="settings-title">Change Username</h5>
                    <p class="text-muted small">Update your display name.</p>
                    <div class="mb-3">
                        <label class="form-label">New Username</label>
                        <input type="text" id="new-username" class="form-control" placeholder="Enter new username">
                    </div>
                    <div id="username-msg" class="d-none mb-2"></div>
                    <button class="btn btn-primary" id="update-username-btn">Update Username</button>
                </div>

                <!-- CHANGE PASSWORD -->
                <div class="settings-section" id="change-password">
                    <h5 class="settings-title">Change Password</h5>
                    <p class="text-muted small">Choose a strong password.</p>
                    <div class="mb-3">
                        <label class="form-label">Current Password</label>
                        <input type="password" id="current-password" class="form-control" placeholder="Enter current password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" id="new-password" class="form-control" placeholder="Enter new password">
                    </div>
                    <div id="password-msg" class="d-none mb-2"></div>
                    <button class="btn btn-primary" id="update-password-btn">Update Password</button>
                </div>

                <!-- DELETE ACCOUNT -->
                <div class="settings-section" id="delete-account">
                    <h5 class="settings-title text-danger">Delete Account</h5>
                    <p class="text-muted small">This will permanently delete your account and all your lists and tasks.</p>
                    <button class="btn btn-danger" id="delete-account-btn">Delete My Account</button>
                </div>

            </main>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
