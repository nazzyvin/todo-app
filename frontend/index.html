<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - ToDo List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container-fluid px-0">
        <div class="app-shell">

            <!-- SIDEBAR -->
            <aside class="sidebar p-3 d-flex flex-column">

                <!-- Create New List -->
                <button class="btn btn-primary w-100 mb-4" data-bs-toggle="modal" data-bs-target="#createListModal">
                    <i class="bi bi-plus-circle me-2 fw-semibold"></i>
                    Create New List
                </button>

                <!-- Lists -->
                <ul class="nav flex-column gap-1" id="listTabs">
                    <li class="nav-item">
                        <a href="#" class="nav-link active d-flex align-items-center" data-filter="all">
                            <i class="bi bi-list-check me-2 fs-5"></i> All Lists
                        </a>
                    </li>
                    <!-- Categories will be loaded dynamically -->
                </ul>

                <!-- Push settings to bottom -->
                <div class="mt-auto pt-3 border-top">
                    <a href="#" class="nav-link text-muted settings d-flex align-items-center" data-filter="">
                        <i class="bi bi-gear me-2 fs-6"></i> Settings
                    </a>
                </div>
            </aside>


            <!-- CONTENT WRAPPER -->
            <div class="app-content p-0">

                <!-- HEADER -->
                <header class="app-header d-flex align-items-center justify-content-between px-4 py-3 border-bottom">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light d-lg-none" id="sidebar-toggle">
                            <i class="bi bi-list fs-5"></i>
                        </button>
                        <div>
                            <h3 class="app-title mb-0">TaskFlow</h3>
                            <p class="text-muted small mb-0">Organize your life, one task at a time</p>
                        </div>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <div class="search-control" id="search-control">
                            <button class="btn btn-light icon-btn" id="search-btn">
                                <i class="bi bi-search"></i>
                            </button>
                            <input type="search id="search-input" placeholder="Search lists..." autocomplete="off">
                        </div>
                        <div class="dropdown">
                            <button class="btn avatar-btn dropdown-toggle" id="profile-dropdown" data-bs-toggle="dropdown">
                                <span id="avatar-initial">U</span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><span class="dropdown-item-text" id="avatar-username">User</span></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" href="#" id="logout-btn"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </header>

                <!-- MAIN CONTENT -->
                <main class="p-4">

                    <!-- LIST CARDS -->
                    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="lists-container">
                        <!-- Cards will be loaded here dynamically -->
                    </div>

                </main>
            </div>
        </div>
    </div>

    <!-- CREATE LIST MODAL -->
    <div class="modal fade" id="createListModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New List</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">List Name</label>
                        <input type="text" class="form-control" id="new-list-name" placeholder="e.g. Daily Routine">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <input type="text" id="new-list-category" class="form-control"
                            placeholder="e.g. Work, Personal, School...">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="create-list-btn">Create</button>
                </div>
            </div>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
