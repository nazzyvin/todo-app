{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="{% static 'js/theme.js' %}"></script>
    <title>BlueFlow - Dashboard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
    <link rel="icon" type="image/png" href="{% static 'icons/favicon-96x96.png' %}" sizes="96x96">
    <link rel="shortcut icon" href="{% static 'icons/favicon.ico' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'icons/apple-touch-icon.png' %}">
    <meta name="apple-mobile-web-app-title" content="BlueFlow" />
    <link rel="manifest" href="{% static 'icons/site.webmanifest' %}">
</head>
<body>
    <div class="app-shell">
        
        <!-- SIDEBAR -->
        <aside class="sidebar p-3 d-flex flex-column">
            <button class="btn btn-primary w-100 mb-4" onclick="window.location.href='/'">
                <i class="bi bi-arrow-left me-2"></i> Back to Lists
            </button>
            <ul class="nav flex-column gap-1">
                <li class="nav-item">
                    <a href="/dashboard/" class="nav-link active d-flex align-items-center">
                        <i data-lucide="chart-column" style="width:18px;height:18px;" class="me-2 fs-5"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/settings/" class="nav-link d-flex align-items-center">
                        <i class="bi bi-gear me-2 fs-5"></i> Settings
                    </a>
                </li>
            </ul>
        </aside>

        <!-- CONTENT -->
        <div class="app-content">

            <!-- HEADER -->
            <header class="app-header d-flex align-items-center justify-content-between px-4 py-3 border-bottom">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-light d-lg-none" id="sidebar-toggle">
                        <i class="bi bi-list"></i>
                    </button>
                    <div class="brand-logo">
                        <i class="bi bi-check-circle"></i>
                    </div>
                    <div>
                        <h3 class="app-title mb-0">Dashboard</h3>
                        <p class="text-muted small mb-0">Your productivity overview</p>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <div class="dropdown">
                        <button class="btn icon-btn dropdown-toggle" id="theme-toggle" data-bs-toggle="dropdown">
                            <i class="bi bi-circle-half" id="theme-icon"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item theme-option" href="#" data-theme-value="light"><i class="bi bi-sun-fill me-2"></i>Light</a></li>
                            <li><a class="dropdown-item theme-option" href="#" data-theme-value="dark"><i class="bi bi-moon-fill me-2"></i>Dark</a></li>
                            <li><a class="dropdown-item theme-option" href="#" data-theme-value="system"><i class="bi bi-circle-half me-2"></i>System</a></li>
                        </ul>
                    </div>
                    <div class="dropdown">
                        <button class="btn avatar-btn dropdown-toggle" data-bs-toggle="dropdown">
                            <span id="avatar-initial">U</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><span class="dropdown-item-text" id="avatar-username">User</span></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" id="logout-btn"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <!-- MAIN -->
            <main class="p-4">

                <!-- STAT CARDS -->
                <div class="row g-4 mb-4">
                    <div class="col-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-blue">
                                <i class="bi bi-list-check"></i>
                            </div>
                            <div class="stat-value" id="total-lists">0</div>
                            <div class="stat-label">Total Lists</div>
                        </div>
                    </div>
                    <div class="col-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-purple">
                                <i class="bi bi-check2-square"></i>
                            </div>
                            <div class="stat-value" id="total-tasks">0</div>
                            <div class="stat-label">Total Tasks</div>
                        </div>
                    </div>
                    <div class="col-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-green">
                                <i class="bi bi-check-circle"></i>
                            </div>
                            <div class="stat-value" id="completed-tasks">0</div>
                            <div class="stat-label">Completed</div>
                        </div>
                    </div>
                    <div class="col-6 col-lg-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-orange">
                                <i class="bi bi-clock"></i>
                            </div>
                            <div class="stat-value" id="pending-tasks">0</div>
                            <div class="stat-label">Pending</div>
                        </div>
                    </div>
                </div>

                <!-- PROGRESS + DUE TODAY -->
                <div class="row g-4 mb-4">
                    <div class="col-12 col-lg-6">
                        <div class="dash-card">
                            <h6 class="dash-card-title">Overall Progress</h6>
                            <div class="progress-ring-wrapper">
                                <svg class="progress-ring" viewBox="0 0 120 120">
                                    <defs>
                                        <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                            <stop offset="0%" stop-color="#60a5fa"/>
                                            <stop offset="100%" stop-color="#1d4ed8"/>
                                        </linearGradient>
                                    </defs>
                                    <circle class="progress-ring-bg" cx="60" cy="60" r="50"/>
                                    <circle class="progress-ring-fill" id="progress-ring-fill" cx="60" cy="60" r="50"/>
                                </svg>
                                <div class="progress-ring-label">
                                    <span id="progress-percent">0%</span>
                                    <small>complete</small>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-lg-6">
                        <div class="dash-card">
                            <h6 class="dash-card-title">Due Today</h6>
                            <ul class="due-today-list" id="due-today-list">
                                <li class="due-today-empty">No tasks due today</li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- TOP LISTS -->
                <div class="row g-4">
                    <div class="col-12">
                        <div class="dash-card">
                            <h6 class="dash-card-title">Lists Overview</h6>
                            <div id="lists-overview"></div>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
    <script src="{% static 'js/dashboard.js' %}"></script>
</body>
</html>
